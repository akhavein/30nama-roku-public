services:
  gateway:
    image: roku-session-gateway:1.7.1
    network_mode: host
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 32
    env_file: .env
    environment:
      GATEWAY_PORT: 8791
      HELPER_ORIGIN: http://127.0.0.1:8789
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:8791/health'); if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs: [/tmp:size=8m,mode=1777]
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
